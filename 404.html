<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Gabriel Matozo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg?v=2" />
  <script>
    (function () {
      var saved = localStorage.getItem('gm-theme');
      if (saved === 'light' || (!saved && window.matchMedia('(prefers-color-scheme: light)').matches)) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0f;
      --text: #e4e4e7;
      --muted: #71717a;
      --secondary: #a1a1aa;
      --accent: #6366f1;
      --accent-light: #818cf8;
      --border: rgba(255, 255, 255, 0.08);
      --card-bg: rgba(255, 255, 255, 0.03);
    }

    [data-theme="light"] {
      --bg: #fafafa;
      --text: #18181b;
      --muted: #71717a;
      --secondary: #52525b;
      --accent: #4f46e5;
      --accent-light: #6366f1;
      --border: rgba(0, 0, 0, 0.08);
      --card-bg: rgba(0, 0, 0, 0.02);
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .noise {
      position: fixed;
      inset: -50%;
      width: 200%;
      height: 200%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.03;
      pointer-events: none;
      z-index: 0;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      animation: float 12s ease-in-out infinite;
    }

    .orb--1 {
      width: 400px;
      height: 400px;
      background: var(--accent);
      top: 20%;
      left: 30%;
    }

    .orb--2 {
      width: 300px;
      height: 300px;
      background: var(--accent-light);
      bottom: 20%;
      right: 20%;
      animation-delay: -4s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -30px) scale(1.05); }
      66% { transform: translate(-20px, 20px) scale(0.95); }
    }

    .content {
      text-align: center;
      position: relative;
      z-index: 1;
      padding: 2rem;
    }

    .glitch {
      font-size: clamp(6rem, 20vw, 12rem);
      font-weight: 700;
      letter-spacing: -0.05em;
      line-height: 1;
      position: relative;
      color: var(--text);
    }

    .glitch::before,
    .glitch::after {
      content: '404';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .glitch::before {
      color: var(--accent);
      animation: glitch-1 3s infinite linear;
      clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
    }

    .glitch::after {
      color: var(--accent-light);
      animation: glitch-2 3s infinite linear;
      clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
    }

    @keyframes glitch-1 {
      0%, 100% { transform: translate(0); }
      20% { transform: translate(-3px, 3px); }
      40% { transform: translate(-3px, -3px); }
      60% { transform: translate(3px, 3px); }
      80% { transform: translate(3px, -3px); }
    }

    @keyframes glitch-2 {
      0%, 100% { transform: translate(0); }
      20% { transform: translate(3px, 3px); }
      40% { transform: translate(3px, -3px); }
      60% { transform: translate(-3px, 3px); }
      80% { transform: translate(-3px, -3px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    .subtitle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
      color: var(--muted);
      margin-top: 1rem;
      margin-bottom: 2.5rem;
    }

    .subtitle span {
      color: var(--accent);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 2rem;
      border-radius: 9999px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: none;
      border: 1px solid var(--border);
      color: var(--text);
      background: transparent;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn:hover {
      border-color: var(--accent);
      color: var(--accent-light);
      transform: translateY(-2px);
      box-shadow: 0 0 24px rgba(99,102,241,0.15);
    }

    .terminal {
      margin-top: 3rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.25rem 1.5rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: left;
      max-width: 420px;
    }

    .terminal__line {
      margin: 0.25rem 0;
    }

    .terminal__prompt {
      color: var(--accent);
    }

    .terminal__cmd {
      color: var(--secondary);
    }

    .terminal__result {
      color: #ef4444;
    }
  </style>
</head>

<body>
  <div class="noise"></div>
  <div class="orb orb--1"></div>
  <div class="orb orb--2"></div>

  <div class="content">
    <div class="glitch">404</div>
    <p class="subtitle"><span>$</span> página não encontrada</p>
    <a href="/" class="btn">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Voltar ao início
    </a>

    <div class="terminal">
      <p class="terminal__line"><span class="terminal__prompt">~/portfolio $</span> <span class="terminal__cmd">find . -name "page"</span></p>
      <p class="terminal__line terminal__result">Error: No such file or directory</p>
      <p class="terminal__line"><span class="terminal__prompt">~/portfolio $</span> <span class="terminal__cmd">cd /home</span></p>
      <p class="terminal__line"><span class="terminal__prompt">~/portfolio $</span> <span class="terminal__cmd">_</span></p>
    </div>
  </div>

</body>

</html>
